name: Build Flutter Engine

on:
  workflow_dispatch:
    inputs:
      target:
        description: Engine target to build
        type: choice
        options:
          - host
          - android
          - ios
          - macos
          - windows
        default: host
      runtime_mode:
        description: Dart runtime mode
        type: choice
        options:
          - debug
          - profile
          - release
        default: debug
      optimized:
        description: Build with compiler optimizations (slower and larger)
        type: boolean
        default: false
      cpu:
        description: 'Target CPU (arm64, x64, x86). Leave empty for defaults.'
        type: string
        default: ''
      simulator:
        description: Build the iOS simulator instead of a device build
        type: boolean
        default: false
      ref:
        description: 'Git ref (branch/tag/SHA) to build. Leave empty for the workflow branch. The ref does not need to contain this workflow.'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: engine-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-engine:
    runs-on: >-
      ${{ contains(fromJSON('["macos","ios"]'), inputs.target) && 'macos-latest' ||
      contains(fromJSON('["windows"]'), inputs.target) && 'windows-latest' ||
      'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      ENGINE_TARGET: ${{ inputs.target }}
      ENGINE_RUNTIME_MODE: ${{ inputs.runtime_mode }}
      ENGINE_OPTIMIZED: ${{ inputs.optimized }}
      ENGINE_CPU: ${{ inputs.cpu }}
      ENGINE_SIMULATOR: ${{ inputs.simulator }}
      ENGINE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      ENGINE_SOURCE_DIR: ${{ github.workspace }}/source
    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4
        with:
          path: workflow
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install depot_tools
        shell: bash
        env:
          DEPOT_TOOLS_DIR: ${{ runner.temp }}/depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS_DIR"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Configure Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> "$GITHUB_ENV"
          echo "WINDOWSSDKDIR=C:\Program Files (x86)\Windows Kits\10" >> "$GITHUB_ENV"
          git config --global core.longpaths true
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          VS_PATH="$("$VSWHERE" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>/dev/null | tail -n 1)"
          if [ -z "$VS_PATH" ] || { [ ! -f "$VS_PATH/VC/Auxiliary/Build/vcvarsall.bat" ] && [ ! -f "$VS_PATH/VC/vcvarsall.bat" ]; }; then
            echo "No Visual Studio installation with VC++ tools found." >&2
            exit 1
          fi
          echo "GYP_MSVS_OVERRIDE_PATH=$VS_PATH" >> "$GITHUB_ENV"
          echo "Using Visual Studio: $VS_PATH"

      - name: Check Windows SDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "=== Windows SDK ==="
          ls -la "/c/Program Files (x86)/Windows Kits/10/Include" || true

          echo "=== Windows SDK Lib ==="
          ls -la "/c/Program Files (x86)/Windows Kits/10/Lib" || true

          echo "=== Visual Studio ==="
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -latest \
            -products '*' \
            -property installationPath

      - name: Bootstrap and sync gclient
        shell: bash
        run: python workflow/.github/scripts/build_engine.py sync

      - name: Generate and build engine
        shell: bash
        run: python workflow/.github/scripts/build_engine.py build

      - name: Upload engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ inputs.target }}-${{ inputs.runtime_mode }}-${{ github.sha }}
          path: source/engine/src/out
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
